# Production nginx config (F014). Copied into the frontend/Dockerfile runtime stage.
#
# Serves the Vite build's static dist/ with SPA fallback, and reverse-proxies API calls to
# the backend container by its docker-compose.prod.yml service name — this keeps the browser
# same-origin in prod, so no CORS configuration is needed on the backend (see ADR 0006).
# Request-id correlation (F016, ADR 0011). This file is included in nginx's http context (via
# conf.d), so map/log_format may be declared here at the top level. Keep the browser's
# X-Request-Id when it sent one, otherwise use nginx's own per-request id; the same value is
# forwarded to the backend below, so one request can be followed nginx -> backend by id.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Path only ($uri, not $request): the query string can carry ids/dates and is never logged.
log_format with_request_id '$remote_addr [$time_local] $request_method $uri -> $status '
                           '$body_bytes_sent ${request_time}s req_id=$req_id';

# Cache policy by response status and final request path ($uri is the rewritten one, so "/" and
# SPA deep links, which fall back internally to /index.html, get no-cache too). Vite fingerprints
# every /assets/ file by content hash, so a cached copy is never stale - it's a different URL the
# moment the content changes. index.html is the one file that must always be revalidated, or a
# browser could keep serving a previous release's shell forever. The long-lived and no-cache
# policies are for 2xx/3xx only: a missing /assets/ file (an old index.html pointing at a hashed
# file a deploy removed) must not be cached for a year (issue #181), so any other error from
# nginx itself is no-store. /api/ is excluded from that: the backend sends its own Cache-Control
# and add_header would duplicate it (an nginx-generated 502 carries none, which is uncacheable by
# default). Regexes are tried in order, first match wins; empty: add_header skips the header.
# This is a map, not a per-location add_header, on purpose: nginx drops every inherited
# add_header in a location that declares its own (issue #175), so the security headers below,
# declared once at server level, would vanish from exactly the responses that need them most.
# Do not add an add_header to a location without repeating the security headers there.
map "$status $uri" $cache_control {
    default                          "";
    "~^[45][0-9][0-9] /api/"         "";
    "~^[45]"                         "no-store";
    "~^[23][0-9][0-9] /assets/"      "public, max-age=31536000, immutable";
    "~^[23][0-9][0-9] /index\.html$" "no-cache";
}

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    # stdout only (rotated by Docker's json-file driver, see docker-compose.prod.yml): the
    # backend's own persisted log already has an access line per request with the same id.
    access_log /dev/stdout with_request_id;

    root /usr/share/nginx/html;
    index index.html;

    # Single-user app behind its own login (F036, ADR 0029), not exposed beyond BIND_ADDR - but
    # defense-in-depth against a browser rendering this origin's responses somewhere unintended
    # still applies. MUI/emotion injects <style>
    # tags at runtime, hence style-src 'unsafe-inline'; everything else stays same-origin only.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;

    # No add_header inside any location below: it would replace the server-level set above.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Note: no trailing slash and no path after the upstream host:port here — nginx therefore
    # forwards the original request URI unchanged (including the /api/ prefix). The backend's
    # own routes are mapped at /api/... (e.g. GET /api/health, see
    # backend/src/main/java/.../infrastructure/web/HealthController.java), not bare paths, so the
    # /api/ prefix must reach the backend as-is rather than being stripped.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        # Spring Security sends these two itself, with the same values as the server-level ones
        # above (issue #169). Hide the upstream copies so the response carries exactly one of
        # each, and nginx's `always` copy still covers every /api status, including its own 502.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }
}
