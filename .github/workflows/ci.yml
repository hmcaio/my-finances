name: CI/CD

# Runs on every push and PR. Images are only built and published (build-and-push job) on
# pushes to main and on vX.Y.Z tag pushes — not on arbitrary feature-branch commits — per
# ADR 0006/0007 and docs/features/F014-cicd-production-packaging/spec.md.
on:
  push:
  pull_request:

env:
  BACKEND_IMAGE: ghcr.io/hmcaio/my-finances-backend
  FRONTEND_IMAGE: ghcr.io/hmcaio/my-finances-frontend

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # No Postgres service container: backend tests use Testcontainers (see ADR 0010), which
    # starts and tears down its own ephemeral Postgres container per run using the Docker
    # daemon already available on GitHub's hosted Ubuntu runners. No credentials to provision
    # or keep in sync here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        # The wrapper script is checked in without the executable bit (repo was authored on
        # Windows, where the bit isn't tracked) — Linux runners need it set explicitly.
        run: chmod +x gradlew
        working-directory: backend

      - name: spotlessCheck + test
        run: ./gradlew spotlessCheck test --no-daemon
        working-directory: backend

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - name: Run tests (if a test script is configured)
        # F001's Vite template hasn't added a test runner yet (no "test" script in
        # package.json) — check at run time rather than hardcoding `npm test`, so this step
        # picks up a real test command automatically once one is added, instead of either
        # failing now or silently staying a no-op forever.
        run: |
          if npm run | grep -qE '^  test$'; then
            npm test
          else
            echo "No \"test\" script in package.json yet - skipping."
          fi
        working-directory: frontend

  build-and-push:
    name: Build and push images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    # Only publish on pushes to main and on vX.Y.Z tags - every push/PR runs the test jobs
    # above, but images are only built for deliberate, deployable versions.
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
