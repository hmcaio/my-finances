name: CI/CD

# The test jobs run on every PR and on pushes to main and to v* tags (a branch push is already
# covered by its PR, so feature branches are not built twice). Images are built, scanned, smoke-tested
# and pushed (build-and-push job) ONLY on vX.Y.Z and vX.Y.Z-rc.N tag pushes: a push to main publishes
# nothing, so `latest` always means the newest release. A pull request that touches what the images
# are made of also builds and scans them and smoke-tests the prod stack (build-images, smoke-prod; no
# push). Per ADR 0032 (which amends ADR 0006/0031) and
# docs/features/F014-cicd-production-packaging/spec.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A new push to a PR supersedes its running workflow, so a quick follow-up commit does not leave the
# old run holding runners. Only PR runs are cancelled: a main or v* tag run is never in-progress-
# cancelled (the tag run publishes images), and each tag has its own group anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_IMAGE: ghcr.io/hmcaio/my-finances-backend
  FRONTEND_IMAGE: ghcr.io/hmcaio/my-finances-frontend
  BACKUP_IMAGE: ghcr.io/hmcaio/my-finances-backup

jobs:
  changes:
    name: Detect code changes
    # The main branch ruleset (ADR 0032) requires the test jobs below, and a required check that never
    # runs blocks the merge forever. So a docs-only PR must not skip the workflow (`[skip ci]`,
    # `paths-ignore`): the jobs start, are skipped by `if:` here, and a skipped job counts as
    # passed. "Docs-only" = every changed path is under docs/ or .claude/ or is a *.md file.
    # Anything that is not a PR (main and tag pushes) always runs everything.
    #
    # `images` is the second, narrower output (ADR 0032, rule 4): true when a changed path can change
    # what the image build, the scan or the prod smoke test sees. It gates build-images and
    # smoke-prod, so a PR that only touches, say, a frontend test still gets the images built, but a
    # docs-only or tooling-only PR does not. A *.md path counts for neither output.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          images=true
          if [ "$EVENT" = "pull_request" ]; then
            # Renamed files list both paths, so moving code into docs/ still counts as code.
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')"
            # An empty list (should not happen) falls through to "run everything".
            if [ -n "$files" ]; then
              code=false
              images=false
              while IFS= read -r file; do
                case "$file" in
                  docs/*|.claude/*|*.md) continue ;;
                esac
                code=true
                # Everything the images are built from or the smoke test runs: the three build
                # contexts, the compose files, the workflow itself, the scan's pin and allowlist, and
                # the scripts and .env.example the stages read.
                case "$file" in
                  backend/*|frontend/*|backup/*|docker-compose*.yml|.github/workflows/*|scripts/trivy/*|.trivyignore|scripts/verify.sh|scripts/smoke-prod.sh|.env.example) images=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "code changed: $code, images affected: $images"

  test-backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The timeouts on the test jobs are several times their usual run: a hung container or browser
    # frees its runner in minutes instead of the 6 h default.
    timeout-minutes: 20
    # No Postgres service container: backend tests use Testcontainers (see ADR 0010), which
    # starts and tears down its own ephemeral Postgres container per run using the Docker
    # daemon already available on GitHub's hosted Ubuntu runners. No credentials to provision
    # or keep in sync here.
    steps:
      - uses: actions/checkout@v7

      - name: Check pinned tool versions agree across files
        run: bash scripts/verify.sh versions

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: spotlessCheck + tests + coverage report
        # scripts/verify.sh is the same entry point you run locally. It runs `test` (fast tier) and
        # `integrationTest` (Spring + Testcontainers tier) with `--continue`, so one run reports
        # everything, and jacocoTestReport in the same invocation (a later step would be skipped
        # when tests fail, or re-run the tests). Report only - no coverage thresholds.
        run: bash scripts/verify.sh backend

      - name: Upload test report
        # Also when tests fail - that is when the report is most useful. `ignore` because Gradle
        # writes nothing if the build stops before the test task (e.g. on spotlessCheck). Both
        # paths sit under backend/build, so the artifact holds reports/tests/test/index.html (the
        # browsable report) and test-results/test/*.xml (JUnit XML).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/reports/tests/integrationTest
            backend/build/test-results/test
            backend/build/test-results/integrationTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        # JaCoCo's HTML report, a static site (open index.html). Nothing is written when the run
        # fails before `jacocoTestReport`, hence `ignore`.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: ignore
          retention-days: 14

  test-frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Lint, format check, type-check and build, tests with coverage
        # scripts/verify.sh is the same entry point you run locally; each check runs even if an
        # earlier one fails. Type-check and build because Vitest and ESLint don't run tsc, so a
        # broken type (e.g. a duplicate operation id in the generated API schema) would otherwise
        # only fail in the Docker image build on tags. Coverage is informational only (no
        # thresholds) and uploaded below.
        run: bash scripts/verify.sh frontend

      - name: Upload test report
        # Vitest's HTML reporter output (configured in vite.config.ts). Unlike the coverage
        # report below it isn't a static site: to browse a downloaded copy run
        # `npx vite preview --outDir test-results` from the extracted folder.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        # Also on test failure so a red run still leaves whatever report was produced;
        # `ignore` because Vitest writes no report when the run fails early.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e-shards:
    name: Frontend e2e shard ${{ matrix.shard }}/3
    # Layout checks in Chromium at mobile/tablet/desktop widths (F020). Runs against the Vite dev
    # server with every /api call mocked, so no backend or Postgres, and it uses nothing the unit
    # test job produces: it starts with the other jobs instead of waiting ~2 min for them (a browser
    # run on a build the unit tests then fail is the price; Actions minutes are free here). The
    # ~230 tests take ~3 min on one runner, so they are split with Playwright's --shard (not by
    # project: a new project or spec file is spread over the shards without touching this file).
    # Not a required check by itself: e2e-frontend below is, so the ruleset keeps one stable name.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Microsoft's Playwright image carries Chromium and its fonts and OS libraries, so there is no
    # `playwright install --with-deps` here: that ran `apt-get` against the runner's Azure mirror,
    # which stalled for 6-12 min on 3 of the first 6 shard jobs (#210). The tag must equal the
    # @playwright/test version in frontend/package-lock.json (scripts/check-versions.sh enforces it;
    # Dependabot cannot see this line, so bump it with the npm update). --ipc=host: Chromium's
    # shared memory outgrows Docker's default 64 MB /dev/shm.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: bash scripts/verify.sh e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/3

      - name: Upload Playwright report and traces
        # Only on failure: the HTML report (with traces from the retry) is what makes a layout
        # regression debuggable. `ignore` in case the run died before writing anything. One artifact
        # per shard (names must be unique within a run).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/e2e-results
          if-no-files-found: ignore
          retention-days: 14

  e2e-frontend:
    name: Frontend e2e (Playwright)
    # The required check and the `needs` of build-and-push: one job whose name does not depend on
    # the shard count. It must run (`always()`) because a skipped required check counts as passed:
    # it passes when the PR is docs-only (shards skipped on purpose) and fails when the code changed
    # and any shard did not succeed, or when `changes` itself failed (which would otherwise skip
    # every shard and let this check through).
    needs: [changes, e2e-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All e2e shards passed (or nothing needed testing)
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shards.result }}
        run: |
          echo "changes: $CHANGES, code changed: $CODE, e2e shards: $SHARDS"
          [ "$CHANGES" = "success" ] || { echo "::error::The change detection did not succeed."; exit 1; }
          if [ "$CODE" = "true" ] && [ "$SHARDS" != "success" ]; then
            echo "::error::The e2e shards did not all succeed ($SHARDS)."
            exit 1
          fi

  test-backup:
    name: Backup sidecar tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Docker is already available on GitHub's hosted Ubuntu runners (same assumption test-backend
    # relies on for Testcontainers) - the e2e test (backup/test/e2e.sh) builds the real sidecar
    # image and runs it against throwaway Postgres containers of its own.
    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: bats unit tests + Docker end-to-end test
        run: bash scripts/verify.sh backup

  # The two image jobs below run on pull requests only (ADR 0032 rule 4, amending ADR 0031's "the
  # scan runs only in build-and-push"): they move a Dockerfile, nginx, compose or image mistake from
  # the immutable release tag to the PR. They build with plain `docker build`, exactly what
  # scripts/verify.sh does locally, and push nothing (no packages permission, no registry login).
  # Two jobs rather than one so each is its own required check and a new CVE (scan) does not hide
  # whether the stack still works (smoke); the price is building the images twice, in parallel, and
  # Actions minutes are free here. Both skip like the test jobs: needs `changes`, gated by `if:`.
  build-images:
    name: Build images and scan
    needs: changes
    if: needs.changes.outputs.images == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the three images and scan them for vulnerabilities
        # Builds my-finances-{backend,frontend,backup}:scan and runs the Trivy gate of ADR 0031.
        # A new CVE can fail it for an unrelated change: bump the dependency or base image, or add a
        # dated .trivyignore entry (docs/conventions/tooling.md).
        run: bash scripts/verify.sh scan

  smoke-prod:
    name: Prod smoke
    needs: changes
    if: needs.changes.outputs.images == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build the three images and smoke-test docker-compose.prod.yml against them
        # scripts/smoke-prod.sh: throwaway login and .env, own compose project, torn down on exit.
        # The assertion list is in its header and in docs/conventions/tooling.md.
        run: bash scripts/verify.sh smoke

  build-and-push:
    name: Build and push images
    needs: [test-backend, test-frontend, e2e-frontend, test-backup]
    runs-on: ubuntu-latest
    # Only publish on vX.Y.Z and vX.Y.Z-rc.N tag pushes (ADR 0032) - every push/PR runs the test
    # jobs above (the tag run repeats them, and this job needs them), but images exist only for
    # deliberate, released versions. A main push publishes nothing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and all branches: the guard below needs origin/main.
          fetch-depth: 0

      - name: Guard the tag (release-shaped, and on main)
        # Only the owner can push a v* tag (protect-release-tags), but nothing else stops one on a
        # stray branch commit, which would publish images of code that never went through the main
        # ruleset. So fail, before anything is built or pushed, unless the tag is exactly vX.Y.Z or
        # vX.Y.Z-rc.N and the tagged commit is an ancestor of origin/main. The shape check also
        # makes the stable-tag test below (no "-" in the ref) exact: only these two forms get past.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N, so nothing is published."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main (ADR 0032). Release tags go on the release PR's squash commit; images are published only for commits on main. Nothing is published. Tags are immutable (protect-release-tags), so tag the right commit with the next version."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build, scan, smoke, then publish: a vulnerable or broken image must not be published. All
      # three images are built into the runner's local daemon first (load: true; nothing leaves the
      # runner), all three are scanned and the production stack is started on them, and only if
      # every check passes are they pushed. The push steps repeat the same
      # builds and reuse the layer cache of this job's one buildx builder, so they add little more
      # than the registry upload (no external cache needed). A failing scan or smoke test stops the
      # job before any push, so no tag (sha, latest or vX.Y.Z) moves in that run.
      #
      # Tags per image: sha-<short> and the git tag itself (vX.Y.Z or vX.Y.Z-rc.N) always; `latest`
      # only for a stable tag. `flavor: latest=false` switches off metadata-action's own implicit
      # `latest` rule so the explicit type=raw line is the only one that can produce it, and its
      # enable expression is true for a tag ref with no "-" (the guard step above admits only
      # vX.Y.Z and vX.Y.Z-rc.N, so "no dash" means stable): a release candidate never moves
      # `latest`. The sha tag stays first in the list: the scan step reads the first line.
      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=tag

      - name: Build backend image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=tag

      - name: Build frontend image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Backup image metadata
        id: backup-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKUP_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=tag

      - name: Build backup image (not pushed yet)
        # BUILD_ID is the git SHA baked into /etc/backup-build-id (ADR 0015) - it changes exactly
        # when this image does, including for the floating "latest" tag, which a tag-string
        # comparison alone could never detect as different from a previous "latest" build.
        uses: docker/build-push-action@v7
        with:
          context: ./backup
          file: ./backup/Dockerfile
          build-args: |
            BUILD_ID=${{ github.sha }}
          load: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}

      - name: Scan images for vulnerabilities (gates the push)
        # Fixable HIGH/CRITICAL findings fail the job: see "Image vulnerability scan" in
        # docs/conventions/tooling.md and .trivyignore. It runs the same pinned Trivy image as
        # `bash scripts/verify.sh scan` does locally. Each image is scanned under its first tag
        # (the sha tag); all tags of one build point at the same image.
        env:
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
          BACKUP_TAGS: ${{ steps.backup-meta.outputs.tags }}
        run: |
          SCAN_IMAGES="$(head -n1 <<< "$BACKEND_TAGS") $(head -n1 <<< "$FRONTEND_TAGS") $(head -n1 <<< "$BACKUP_TAGS")"
          export SCAN_IMAGES
          bash scripts/verify.sh scan

      - name: Smoke-test the production stack on these images (gates the push)
        # The same check the pull-request job `Prod smoke` runs (scripts/smoke-prod.sh), here on the
        # exact images loaded above, so a broken image (nginx, compose wiring, login, backups) is
        # never published (ADR 0032 rule 4). It retags them itself; nothing is pulled or pushed.
        env:
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
          BACKUP_TAGS: ${{ steps.backup-meta.outputs.tags }}
        run: |
          SMOKE_BACKEND_IMAGE="$(head -n1 <<< "$BACKEND_TAGS")"
          SMOKE_FRONTEND_IMAGE="$(head -n1 <<< "$FRONTEND_TAGS")"
          SMOKE_BACKUP_IMAGE="$(head -n1 <<< "$BACKUP_TAGS")"
          export SMOKE_BACKEND_IMAGE SMOKE_FRONTEND_IMAGE SMOKE_BACKUP_IMAGE
          bash scripts/verify.sh smoke

      - name: Push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Push backup image
        uses: docker/build-push-action@v7
        with:
          context: ./backup
          file: ./backup/Dockerfile
          build-args: |
            BUILD_ID=${{ github.sha }}
          push: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}
