# Bumps the pinned image tags and Actions (issue #73). Opens one PR per ecosystem update; a bump
# that touches only one of several files pinning the same tool (e.g. postgres in both compose files
# and the Testcontainers config) fails scripts/check-versions.sh in CI, so bump the siblings in the
# same PR. npm and Gradle dependencies are deliberately not covered (lockfiles + noise). The backup
# sidecar image (backup/Dockerfile, F018) is covered for its `alpine` base tag only: it is no longer
# built on the postgres image (#204), so the Alpine packages it installs (age, rclone, ...) are
# unpinned and not tracked, and its Postgres major is an ARG (POSTGRES_MAJOR) Dependabot cannot see;
# scripts/check-versions.sh compares that ARG with the compose files' postgres tag. The bats test
# image (backup/test/Dockerfile) is a second /backup/test entry below.
#
# Major bumps of postgres, eclipse-temurin and node are ignored on purpose: each is a coordinated
# move across several files (postgres: both compose files, Testcontainers, POSTGRES_MAJOR in the
# backup image;
# node: .nvmrc, the frontend Dockerfile, the dev compose service; JDK: backend Dockerfile and dev
# compose), not something one Dependabot PR can do. Minor/patch updates still arrive. To follow a
# new major, bump every sibling by hand in one PR (docs/conventions/tooling.md, "Pinned versions");
# the ignore is relative to the pinned version, so it keeps applying on the new line. eclipse-temurin:
# the JDK is an LTS pin (25), so the next LTS is moved by hand the same way; the majors Dependabot
# would otherwise propose are non-LTS feature releases.
#
# nginx (frontend/Dockerfile) is held to the stable line: nginx numbers stable releases with even
# minors (1.30, 1.32, ...) and mainline with odd ones (1.31, 1.33, ...), so both minor and major
# bumps are ignored and only patch updates within the pinned 1.30.x arrive. To follow the next
# stable line, move it by hand to the next even minor (e.g. 1.32): bump frontend/Dockerfile and
# re-run `bash scripts/verify.sh scan`; the Trivy scan gate catches a stale base image meanwhile.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: monthly
  # The bats test image (#213) is on the sidecar's Alpine tag; Dependabot opens one PR per
  # directory, and scripts/check-versions.sh fails until the two tags agree, so bump both in one PR.
  - package-ecosystem: docker
    directory: /backup/test
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Stable nginx line only (even minors); see the header comment.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  # Image scanner pin (scripts/trivy/Dockerfile, see docs/conventions/tooling.md).
  - package-ecosystem: docker
    directory: /scripts/trivy
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
