plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
}

group = 'com.chm.myfinances'
version = '0.2.0'
description = 'My Finances backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Security pins for the image scan gate (ADR 0031, issue #174): Spring Boot 4.1.1 manages older
// Tomcat/Jackson releases that carry fixable HIGH/CRITICAL findings. Remove each override once a
// Spring Boot 4.1.x release ships a BOM at or above these versions.
ext['tomcat.version'] = '11.0.25'
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'

dependencyManagement {
    imports {
        // Spring Boot's BOM pins the core `testcontainers` artifact but not the
        // `junit-jupiter`/`postgresql` modules used below - import the Testcontainers BOM
        // explicitly so every Testcontainers module resolves to one consistent version (ADR 0010).
        mavenBom "org.testcontainers:testcontainers-bom:${libs.versions.testcontainers.get()}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // F036 (ADR 0029): session-cookie authentication + CSRF; the Argon2 encoder needs Bouncy Castle.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation libs.bouncycastle.bcprov
    implementation libs.springdoc.openapi.starter.webmvc.ui
    // F030: PdfReportWriter (application/report) renders the FII portfolio and budgets reports' PDFs.
    implementation libs.openpdf
    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Testcontainers 2.x (pulled in via the testcontainers-bom import above) renamed these
    // modules from the old `junit-jupiter`/`postgresql` artifact ids to `testcontainers-*`.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation libs.archunit.junit5
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// F036 (ADR 0029): one-off setup tool that turns a typed password into the Argon2 hash for
// AUTH_PASSWORD_HASH, using the same encoder the app verifies logins with. Reads the AUTH_PASSWORD
// environment variable if set, otherwise prompts on stdin. Use -q so only the hash line is printed:
//   ./gradlew -q generateAuthHash
tasks.register('generateAuthHash', JavaExec) {
    description = 'Prints the Argon2 hash of a password, for AUTH_PASSWORD_HASH (F036).'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.chm.myfinances.infrastructure.auth.AuthHashGenerator'
    standardInput = System.in
}

// Two tiers, split by the JUnit tag `integration` (carried by every @SpringBootTest class, enforced
// by TestTaggingTest): `test` is the fast tier (domain, application with fakes, ArchUnit - no
// Docker), `integrationTest` runs the Spring + Testcontainers Postgres tier, and `check` runs both.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the @SpringBootTest tests against the Testcontainers Postgres.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

// Writes the OpenAPI document (the /v3/api-docs the app serves behind its login) to a file, with no
// running backend and no password: it boots the app for one MockMvc request against the
// Testcontainers Postgres, so it needs Docker like integrationTest. Input of
// `npm run generate-api-types -- --offline`, which passes -PopenapiOutput=<file>; without it the
// document lands in build/openapi/api-docs.json.
tasks.register('exportOpenApi', Test) {
    description = 'Writes /v3/api-docs to a file (offline input of generate-api-types).'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    filter {
        includeTestsMatching 'com.chm.myfinances.infrastructure.config.OpenApiDocumentExportTest'
    }
    def output = providers.gradleProperty('openapiOutput')
        .orElse(layout.buildDirectory.file('openapi/api-docs.json').map { it.asFile.absolutePath })
    systemProperty 'openapi.output', output.get()
    // Never "up to date": the point is to write the file.
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.withType(Test).configureEach {
    // Tests run under the default `dev` profile, whose logging.file.name would write
    // backend/logs/. System properties outrank config files, and Spring Boot treats an empty
    // name as "no log file" (F016).
    systemProperty 'logging.file.name', ''
    // F036: the app refuses to start without a credential. Tests log in as test-user /
    // test-password-f036 (testsupport/web/TestCredentials) against this Argon2 hash. System
    // properties outrank application.yml's ${AUTH_USERNAME:}/${AUTH_PASSWORD_HASH:} placeholders.
    systemProperty 'myfinances.auth.username', 'test-user'
    systemProperty 'myfinances.auth.password-hash',
        '$argon2id$v=19$m=16384,t=2,p=1$C0t+EgaETT/HWBygrtWqjA$q6cCFV9puHfa2kbXHTHss3z8e2IKHh8nuJLtVTktQVY'
    // Pinned non-UTC zone (CI runs in UTC, dev machines don't), so a UTC-vs-local bug fails here
    // too instead of only on someone's laptop in the evening (issue #73). A JVM arg, not a system
    // property, so it applies before anything caches the default zone. Frontend: `test.env.TZ` in vite.config.ts.
    jvmArgs '-Duser.timezone=America/Sao_Paulo'
}

// Report-only (issue #31, B15): no coverage thresholds/enforcement, and not wired into the
// plain `test` task's own dependency chain, so the everyday `./gradlew test` dev loop doesn't
// pay for report generation. The report merges both tiers' execution data, so
// `./gradlew jacocoTestReport` runs `test` and `integrationTest` and produces
// build/reports/jacoco/test/html/index.html. CI runs it in the same invocation as the tests and
// uploads the HTML report as an artifact.
jacocoTestReport {
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')) { include '*.exec' })
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    reports {
        html.required = true
        xml.required = false
        csv.required = false
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat(libs.versions.googleJavaFormat.get())
    }
}
