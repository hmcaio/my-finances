# Production Spring profile (F014). Same shape as application.yml (dev), but datasource
# credentials/host come from environment variables instead of hardcoded local-dev values.
# These env vars are supplied by docker-compose.prod.yml from the gitignored .env file — see
# .env.example at the repo root for the required keys. Never commit real values.
#
# server.address is intentionally NOT pinned to 127.0.0.1 here (unlike dev's application.yml):
# in docker-compose.prod.yml the backend and frontend run in separate containers, and the
# frontend's nginx reaches this service over the Docker network by service name (`backend`),
# which requires listening on all interfaces inside the container. The container itself is still
# not published to the host/LAN in docker-compose.prod.yml (only nginx's port is), so the
# PRD S7.1 "localhost/trusted-machine only" constraint still holds at the host boundary.
server:
  port: 8080

spring:
  application:
    name: my-finances-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
