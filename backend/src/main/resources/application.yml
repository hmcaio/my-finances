spring:
  application:
    name: my-finances-backend

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    # Spring's own "Resolved [<exception>: <message>]" WARN lines carry exception messages, i.e.
    # entity names (@ResponseStatus 404/409s). Off by default in Spring Boot, but DevTools (on the
    # bootRun classpath) turns it on - so pin it off. GlobalExceptionHandler logs the exception
    # class name instead (F016, ADR 0011).
    log-resolved-exception: false

  web:
    error:
      # Defense in depth alongside GlobalExceptionHandler (infrastructure/web): keep this off in
      # every profile so no error response ever carries an exception's message/stack trace/binding
      # errors, even if someone adds a profile-specific override for local debugging and forgets to
      # revert it (security-audit fix). These already default to "never" in this Spring Boot
      # version - set explicitly so the guarantee is enforced by config, not by an implicit
      # default someone could silently lose track of. (The older `server.error.*` spelling of
      # these properties is deprecated as of this Spring Boot version in favor of `spring.web.error.*`.)
      include-stacktrace: never
      include-message: never
      include-binding-errors: never

server:
  port: 8080

logging:
  level:
    # DefaultHandlerExceptionResolver always warn-logs "Resolved [<exception>: <message>]" for
    # Spring's own 4xx exceptions, and a validation failure's message includes "rejected value
    # [...]" - i.e. amounts and descriptions. The access line's status already says a 400 happened.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
  pattern:
    # Prefix every line with the request id the RequestLoggingFilter puts in the MDC (blank
    # outside a request, e.g. at startup). See ADR 0011.
    correlation: "[%X{requestId:-}] "
  logback:
    # Only takes effect where a profile sets logging.file.name (dev/prod); the file name itself
    # is environment-specific, so it lives in the profile files, not here.
    rollingpolicy:
      max-file-size: 50MB
      max-history: 90
      total-size-cap: 300MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

myfinances:
  backup:
    # F018, ADR 0015: where FileBackupStatusAdapter reads the sidecar's status.json. Same default
    # in every profile (matches the read-only /backups mount docker-compose.prod.yml gives the
    # backend container); BACKUP_STATUS_PATH overrides it without a rebuild. Dev has no sidecar
    # and no mount at all, so the file is simply absent there - GET /api/backup-status returns
    # UNKNOWN, not an error.
    status-path: ${BACKUP_STATUS_PATH:/backups/status.json}
