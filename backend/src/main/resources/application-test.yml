# CI test profile (F014). Activated explicitly via SPRING_PROFILES_ACTIVE=test in
# .github/workflows/ci.yml, running against that workflow's own Postgres service container.
# Deliberately distinct db/user/password from dev's, so test correctness never depends on
# coincidentally matching dev's hardcoded values.
server:
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myfinances_test
    username: myfinances_test
    password: myfinances_test
    driver-class-name: org.postgresql.Driver
