# Dev stack. The project name is pinned (not the directory name) so a prod deploy in another
# folder that is also called my-finances can never share it: Compose matches containers by
# project + service name, and both files define postgres/backend/frontend (#216). Named volumes
# are prefixed with it (my-finances-dev_*). prod's name stays directory-derived on purpose
# (docker-compose.prod.yml): its data volume is prefixed with it, so pinning it would move the
# database of every deploy whose folder is not called my-finances. `-p` still overrides this.
name: my-finances-dev

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: my-finances-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myfinances
      POSTGRES_USER: myfinances
      POSTGRES_PASSWORD: myfinances
    ports:
      # Host loopback only, regardless of BIND_ADDR (F036, ADR 0029): there is no legitimate reason
      # for the database to be reachable from another machine, and BIND_ADDR exists to expose the
      # (authenticated) app - not this.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps its cluster in /var/lib/postgresql/18/docker and declares the VOLUME at
      # /var/lib/postgresql, so that is the mount point (the image refuses to start with a mount at
      # .../data). The name carries the major: a PG17 volume cannot be opened by 18.
      - my-finances-postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinances -d myfinances"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: my-finances-pgadmin
    restart: unless-stopped
    environment:
      # Plain-text dev-only credentials, matching this file's existing convention for postgres's
      # own credentials above (local, no-auth, single-user dev environment per the PRD).
      PGADMIN_DEFAULT_EMAIL: dev@myfinances.com
      PGADMIN_DEFAULT_PASSWORD: myfinances
    ports:
      # http://localhost:5050 - log in with PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD above.
      # Host loopback only, regardless of BIND_ADDR (F036, ADR 0029) - same reason as postgres.
      - "127.0.0.1:5050:80"
    volumes:
      - my-finances-pgadmin-data:/var/lib/pgadmin
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  # --- Full-stack dev (ADR 0018). Opt-in: `docker compose --profile full up`. Plain
  # `docker compose up -d` still starts only postgres + pgAdmin, so the native workflow
  # (`./gradlew bootRun`, `npm run dev`) keeps working. Stop the native processes first (or don't
  # use this profile): both publish 8080/5173. Source is bind-mounted for hot reload; build
  # output, Gradle/npm caches and node_modules live in named volumes so the Windows host's copies
  # never leak into the Linux containers (and the bind mount stays fast).
  backend:
    profiles: [full]
    image: eclipse-temurin:25.0.4.1_1-jdk-alpine
    container_name: my-finances-backend
    working_dir: /workspace
    # dev-run.sh runs bootRun plus a background recompile on source change; DevTools (on the
    # bootRun classpath) restarts the app when the new classes land.
    command: sh ./dev-run.sh
    environment:
      # dev profile binds 127.0.0.1 and points at localhost:5432 - neither works inside a container.
      SERVER_ADDRESS: 0.0.0.0
      # Read by backend/gradle/relocate-build-dir.init.gradle (see dev-run.sh); ends in /build.
      GRADLE_BUILD_DIR: /gradle-out/build
      # The app's "today" (defaults, recurring catch-up) is the JVM's zone, while the browser uses
      # its own local time - keep them equal by setting TZ in .env. Same variable as prod.
      TZ: ${TZ:-UTC}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myfinances
      # F036, ADR 0029: the single shared login, required in dev too (no bypass). From .env (see
      # .env.example); the backend refuses to start without them and says why. The password hash
      # contains $ characters, so it must be single-quoted in .env.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      # Credentialed CORS needs exact origins: the Vite dev server on localhost, and on BIND_ADDR
      # when the dev stack is exposed there (the SPA then calls the API on the host it was served
      # from - see frontend/src/api/core/client.ts).
      MYFINANCES_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://${BIND_ADDR:-127.0.0.1}:5173
      # Optional remote debugger: publish 5005 below and attach an IDE "Remote JVM Debug" config.
      # JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      # Host loopback by default (PRD S7.1); BIND_ADDR (F036, ADR 0029) is the one knob that moves
      # it to a private-network interface. The browser calls the API directly (VITE_API_BASE_URL).
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./backend:/workspace
      - my-finances-gradle-cache:/root/.gradle
      # Build output and Gradle's project cache, outside the bind mount on purpose: a volume
      # mounted inside ./backend (at /workspace/build) makes Docker create a root-owned, empty
      # backend/build on the host that host Gradle cannot write to. See backend/dev-run.sh.
      - my-finances-backend-build:/gradle-out
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  frontend:
    profiles: [full]
    image: node:24.22.1-alpine
    container_name: my-finances-frontend
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"
    environment:
      # Bind mounts from a Windows host don't deliver file-change events; see vite.config.ts.
      VITE_USE_POLLING: "true"
    ports:
      # Same BIND_ADDR knob as the backend above (F036, ADR 0029).
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - my-finances-frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Vite answering on 5173 (127.0.0.1, not "localhost": busybox wget tries ::1 first). The
      # start period and retry budget cover the first start's `npm ci` into an empty node_modules
      # volume, which takes minutes; later starts are healthy in seconds.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  my-finances-postgres-18-data:
  my-finances-pgadmin-data:
  my-finances-gradle-cache:
  my-finances-backend-build:
  my-finances-frontend-node-modules:

# Pre-registers the `postgres` server in pgAdmin (no password baked in - pgAdmin still prompts on
# first connect). pgAdmin only imports this when its own volume is empty, so editing it later needs
# `docker compose down -v` to take effect on an existing my-finances-pgadmin-data volume.
configs:
  servers.json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "postgres",
            "Group": "Servers",
            "Port": 5432,
            "Username": "myfinances",
            "Host": "postgres",
            "SSLMode": "prefer",
            "MaintenanceDB": "myfinances"
          }
        }
      }
