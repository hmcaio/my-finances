# Layered over docker-compose.prod.yml by run.sh so a benchmark stack can run beside a real prod
# stack. The prod file pins four container names and one volume name, which would make a second
# project share (and a `down -v` delete) the real prod logs; `!reset` drops them so Compose derives
# project-scoped names instead, and the prod file stays untouched. run.sh's guard (guard.mjs) then
# checks the resolved config, so a new pinned name in the prod file fails the run instead of
# reaching prod. Needs Docker Compose 2.24+ for `!reset`.
#
# `my-finances-backups-prod` is deliberately NOT reset: it is `external: true` so `down -v` cannot
# remove the backups. The benchmark sets BACKUP_DIR to a scratch folder, so nothing mounts it.
services:
  postgres:
    container_name: !reset null
  backup:
    container_name: !reset null
  backend:
    container_name: !reset null
  frontend:
    container_name: !reset null
volumes:
  my-finances-logs-prod:
    name: !reset null
